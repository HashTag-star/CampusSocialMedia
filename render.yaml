services:
  # 1. Web Service (Node.js Backend)
  - type: web
    name: campus-social-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
    probes:
        - path: /health
          type: http
          intervalSeconds: 15
          timeoutSeconds: 5

      - key: DATABASE_URL
        sync: false # User must provide this manually (Supabase URL)
